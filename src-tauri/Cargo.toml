[package]
name = "opencore-studio"
version = "0.2.0"
description = "Cross-platform all-in-one Hackintosh & OpenCore configuration studio"
authors = ["OpenCore Studio"]
edition = "2021"

[lib]
name = "opencore_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.7"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
