name: Build Windows & macOS Installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            args: ""
          - name: macOS-AppleSilicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS-Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Run Rust core engine unit tests
        if: matrix.name != 'macOS-Intel'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Desktop Installer (.exe / .msi / .dmg)
        run: npx tauri build ${{ matrix.args }}

      - name: Upload Windows Installer Artifacts (.exe & .msi)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Studio-Windows-x64-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/opencore-studio.exe

      - name: Upload macOS Installer Artifacts (.dmg)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Studio-${{ matrix.name }}-Installer
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg

      - name: Publish to GitHub Releases (on version tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/opencore-studio.exe
            src-tauri/target/*/release/bundle/dmg/*.dmg
